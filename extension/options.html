<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Job Hunter settings</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <main>
    <h2>Job Hunter settings</h2>
    <label>App address<br><input id="appUrl" placeholder="https://your-app.azurewebsites.net" style="width:100%"></label>
    <label>Extension key<br><input id="key" type="password" style="width:100%"></label>
    <p class="muted">Find the key in your Job Hunter app: Profile &amp; answers &rarr; Show extension key.</p>
    <label><input id="autoOpen" type="checkbox"> Open the application when a shortlisted job's resume is ready,
      and fill it up to Review once its form opens (with the Job Hunter panel open)</label>
    <button id="save" class="primary">Save and test</button>
    <p id="status"></p>
  </main>
  <script src="api.js"></script>
  <script src="options.js"></script>
</body>
</html>
