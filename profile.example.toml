# Copy to profile.toml (gitignored) and fill in your details.

[candidate]
name = "Your Name"
linkedin_url = "https://www.linkedin.com/in/your-profile"
base_resume = "resumes/base_resume.pdf"   # .pdf or .docx
output_dir = "resumes/tailored"

# Text the tailored resume must keep (project names, certifications, ...).
must_keep = [
  "Example Project Name",
  "Example Certification",
]

[search]
query = "data analyst"
# Or run several searches per run (overrides query):
# queries = ["data analyst", "data scientist", "machine learning engineer", "ai engineer"]
location = "New York, NY"     # empty string = anywhere in the country
country = "us"                # Adzuna country code
max_results = 25
max_days_old = 14
include_remote = true         # also search Remotive's remote jobs
exclude_keywords = ["senior", "lead", "director", "principal"]
min_score = 40                # skip jobs that score below this (0-100)

[scoring]
# Earlier titles score higher.
preferred_titles = [
  "data analyst",
  "analytics engineer",
  "business intelligence",
  "data engineer",
  "business analyst",
]

[scoring.keywords]
# keyword = weight; matched against the title + description
sql = 5
python = 5
tableau = 4
"power bi" = 4
excel = 3
etl = 4
snowflake = 4
dbt = 3
"data warehouse" = 3
dashboard = 3
azure = 2
aws = 2

[scoring.locations]
# location substring = points (doubled, capped at 20)
remote = 8
"new york" = 6
hybrid = 5

[sponsorship]
# H-1B sponsor table from the H-1B Tech Jobs Tracker
# (https://github.com/srikanthmannepalli0502-cmyk/h1b-job-market-tracker, pipeline/export_sponsors.py).
data_file = "data/h1b_sponsors.csv"
# Role groups whose H-1B filings count most:
# analyst, data_science, ai, data_engineering, software
roles = ["analyst", "data_science", "ai"]
weight = 35                  # share (0-100) of the overall score that comes from sponsorship
hide_non_sponsors = false    # true = drop jobs at companies with no H-1B filings

[boards]
# Target companies' own Greenhouse / Lever / Ashby boards; build the list with
# `python -m jobhunter discover-boards`. Postings must match a preferred title, be full
# time, in the US (or remote) and newer than max_days_old.
file = "data/company_boards.csv"
enabled = true
